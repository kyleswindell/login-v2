name: M1 Implementation Slice
description: Define a bounded verification-first implementation task for Codex or a developer.
title: "[M1 Implementation]: "
projects:
    - "kyleswindell/1"

body:
    - type: markdown
      attributes:
          value: |
              Use this form for one bounded M1 implementation slice.

              The issue must identify accepted scope, ownership, canonical sources, acceptance criteria, verification, protected evidence, implementation boundaries, review authority, and stop conditions before production implementation begins.

              Creating the issue does **not** make it implementation-ready. GitHub Project status remains the delivery-state source of truth. Do not move the issue to **Ready** until the Definition of Ready in `docs/02-standards/coding/Agent Implementation Checklist.md` and the applicable requirements in `docs/02-standards/testing/` are satisfied.

              **Ready** requires a complete and executable verification contract. A required initial proof and accepted protected baseline may be established by the authorized executing session after the issue reaches **Ready**, but they must be completed before the first production implementation write.

              Test-source implementation rules are owned by `docs/02-standards/coding/test-implementation/`.

              Do not include passwords, tokens, private keys, production secrets, authorization headers, cookies, or unredacted sensitive data.

    - type: input
      id: planning-source
      attributes:
          label: Planning source or parent work
          description: Identify the accepted planning source, parent issue, milestone item, or explicit repository-owner direction that produced this slice.
          placeholder: "Example: M1 Auth implementation planning; parent issue #123; Core Service Build Plan Matrix row ..."
      validations:
          required: true

    - type: dropdown
      id: repository-work-owner
      attributes:
          label: Primary repository work owner
          description: Select the repository work area primarily responsible for delivering this slice.
          options:
              - Application
              - Documentation
              - Operations
              - Tests
              - Tooling
          multiple: false
      validations:
          required: true

    - type: dropdown
      id: application-ownership-area
      attributes:
          label: Application ownership area
          description: Select the canonical application owner when application behavior or application-owned source is affected. Laravel integration is an integration boundary, not a fourth ownership area.
          options:
              - Core
              - Module
              - UI
              - Not applicable
          multiple: false
      validations:
          required: true

    - type: input
      id: specific-owner
      attributes:
          label: Specific owner or integration boundary
          description: Name the smallest clear capability, Module, UI responsibility, Laravel integration boundary, documentation branch, operational area, test owner, or tool that owns the work.
          placeholder: "Example: Core/Auth; Modules/Customers; UI/Navigation; Laravel integration — app/Http; docs/testing; source-template tooling"
      validations:
          required: true

    - type: dropdown
      id: execution-mode
      attributes:
          label: Execution mode
          description: Select the permitted implementation mode for this slice.
          options:
              - Human-led
              - Codex-assisted
              - Codex-delegable
              - Codex-delegable with specialist review
          multiple: false
      validations:
          required: true

    - type: dropdown
      id: work-categories
      attributes:
          label: Work categories
          description: Select every category materially affected by this slice. Selecting Operations or deployment identifies implementation or verification impact only; it does not authorize deployment execution.
          options:
              - Application behavior
              - Source files, stubs, or generators
              - Database or migration
              - UI
              - Security-sensitive behavior
              - Queue, event, or scheduled behavior
              - Query or performance behavior
              - Tests or verification source
              - Documentation synchronization
              - Operations or deployment
          multiple: true
      validations:
          required: true

    - type: textarea
      id: outcome-and-scope
      attributes:
          label: Requested outcome and in-scope behavior
          description: Define one bounded outcome and the exact behavior this issue is allowed to implement.
          placeholder: |
              Requested outcome:
              - ...

              In scope:
              - ...
              - ...

              Affected actor or system workflow:
              - ...

              Required successful behavior:
              - ...

              Required rejection or failure behavior:
              - ...
      validations:
          required: true

    - type: textarea
      id: non-goals-and-compatibility
      attributes:
          label: Non-goals and compatibility requirements
          description: State what this issue must not change and which existing contracts, routes, keys, tables, payloads, behaviors, or compatibility layers must remain stable.
          placeholder: |
              Non-goals:
              - ...
              - ...

              Compatibility requirements:
              - Preserve ...
              - Do not rename ...
              - Do not remove ...
              - Do not implement deferred ...

              Explicitly deferred adjacent work:
              - ...
      validations:
          required: true

    - type: textarea
      id: canonical-sources
      attributes:
          label: Governing canonical sources and dependencies
          description: List the current sources that control this slice. Use Not applicable only after review. Planning provides sequencing and intent; it does not replace canonical behavior, architecture, schema, security, UI, or runbook owners.
          placeholder: |
              Root / scoped AGENTS.md:
              - `AGENTS.md`
              - `.../AGENTS.md`

              Architecture:
              - `docs/03-architecture/...`

              Feature or behavior contract:
              - `docs/04-features/...`
              - Not applicable

              Cross-capability flow:
              - `docs/05-flows/...`
              - Not applicable

              Database contract:
              - `docs/06-database/...`
              - Not applicable

              Applicable standards:
              - `docs/02-standards/...`

              UI Contract or visual authority:
              - `...`
              - Not applicable

              Operational runbook:
              - `docs/10-runbooks/...`
              - Not applicable

              Accepted decisions:
              - `docs/01-decisions/...`
              - None

              Blocking dependencies:
              - #...
              - None
      validations:
          required: true

    - type: textarea
      id: implementation-boundaries
      attributes:
          label: Implementation boundaries and smallest production slice
          description: Define the allowed and forbidden repository scope before production implementation. Identify expected files, archetypes, public Contracts, dependencies, stubs, and shared-file risks.
          placeholder: |
              Allowed paths:
              - `app/Core/...`
              - `resources/...`
              - `...`

              Forbidden paths:
              - `...`
              - No changes outside the allowed paths without repository-owner approval

              Expected files to create:
              - ...

              Expected files to modify:
              - ...

              Expected files to delete:
              - None

              File archetypes:
              - Action
              - DTO
              - test
              - ...

              Approved stubs or generators:
              - `stubs/...`
              - Not applicable

              Public Contracts or cross-owner dependencies:
              - ...

              Prohibited dependencies or placements:
              - ...

              Shared-file / concurrent-work risks:
              - ...
              - None

              Smallest production behavior to implement:
              - ...
      validations:
          required: true

    - type: textarea
      id: acceptance-criteria
      attributes:
          label: Acceptance criteria
          description: Define stable AC-* identifiers and observable target behavior. Criteria define what must be true; proof details belong in the verification mapping below.
          placeholder: |
              AC-01 — ...
              - Success:
              - Required rejection or failure:
              - Persistence / state:
              - Required side effects:
              - Prohibited side effects:
              - Compatibility:

              AC-02 — ...
              - Success:
              - Required rejection or failure:
              - Persistence / state:
              - Required side effects:
              - Prohibited side effects:
              - Compatibility:
      validations:
          required: true

    - type: dropdown
      id: proof-modes
      attributes:
          label: Applicable proof modes
          description: Select every proof mode materially required by the acceptance criteria.
          options:
              - New behavior or bug-fix expected-nonpass proof
              - Characterization or behavior-preservation proof
              - Public Contract proof
              - Security or data-boundary proof
              - Database or migration proof
              - UI, browser, or accessibility proof
              - Documentation proof
              - Native-platform or operational proof
          multiple: true
      validations:
          required: true

    - type: textarea
      id: acceptance-proof-mapping
      attributes:
          label: Acceptance-to-proof mapping
          description: Map every AC-* criterion to one or more PF-* proofs. Each proof must identify preimplementation applicability, method, target, actor/fixture, environment, exact command or procedure, expected initial result when executed, and final required result.
          placeholder: |
              PF-01
              - Criteria: AC-01
              - Observable behavior:
              - Proof method / level:
              - Test, script, route, review surface, or evidence path:
              - Actor and fixture:
              - Required environment:
              - Exact command or procedure:
              - Preimplementation applicability: REQUIRED / CONDITIONAL / NOT_APPLICABLE
              - Applicability condition or NOT_APPLICABLE reason:
              - Initial expected result when executed:
              - Final required result:
              - Manual or specialist review:
              - Non-goal protected by this proof:

              PF-02
              - Criteria: AC-02
              - ...
      validations:
          required: true

    - type: textarea
      id: initial-proof
      attributes:
          label: Preimplementation proof declaration
          description: Declare preimplementation applicability for each due PF-* proof. For REQUIRED proofs, and CONDITIONAL proofs whose prerequisite becomes true, define the smallest executable proof required before the first production implementation write. NOT_APPLICABLE must be declared before execution with an accepted reason and does not remove the required final proof. EXPECTED_NONPASS is allowed only for the exact predeclared missing behavior or other explicitly permitted evidence result; unexpected syntax, fixture, dependency, infrastructure, tooling, environment, discovery, or boot failures are FAIL.
          placeholder: |
              PF-* applicability:
              - PF-01: REQUIRED
              - PF-02: CONDITIONAL — required when ...
              - PF-03: NOT_APPLICABLE — reason: ...

              Conditional prerequisite resolution:
              - PF-02 condition:
              - Must resolve to REQUIRED or NOT_APPLICABLE before:

              PF-* IDs requiring initial execution:
              - ...
              - None — all applicable proofs are NOT_APPLICABLE at the preimplementation stage

              Proof-source files permitted before production implementation:
              - ...
              - None

              Exact command or procedure:
              - ...
              - Not applicable when no initial execution is required

              Required working directory:
              - ...

              Required OS / runtime / database / browser / external service:
              - ...

              Responsible executor:
              - ...

              Allowed initial result class when executed:
              - PASS / EXPECTED_NONPASS

              Exact expected observable initial result when executed:
              - ...

              Expected exit code:
              - ...

              Evidence output / report path:
              - ...

              Evidence hash procedure:
              - ...

              Results that must be classified FAIL:
              - Any unexpected ...
              - ...

              If no separate preimplementation execution is required:
              - Final proof is still required and is declared below
      validations:
          required: true

    - type: textarea
      id: protected-baseline
      attributes:
          label: Protected verification baseline plan and accepted identity
          description: Before execution, declare the proof paths, semantics, edit boundaries, preferred baseline identity, fallback identity, and revision authority that will become protected if initial proof is accepted. After accepted initial proof, record the actual baseline identity and evidence before production implementation. For proofs whose preimplementation stage is NOT_APPLICABLE, state that no separate initial baseline is established while preserving the final proof contract.
          placeholder: |
              Expected protected test / proof paths:
              - ...
              - Not applicable for PF-* with no separate initial proof

              Expected protected fixture / scenario / dataset paths:
              - ...

              Protected UI Contract / review procedure / other evidence:
              - ...
              - Not applicable

              Intended protected assertions and behaviors:
              - ...

              Preferred baseline identity:
              - Dedicated proof-only commit after accepted initial proof
              - Not applicable

              Fallback baseline identity:
              - File hashes / staged or working-tree proof patch / other reproducible identity
              - Not applicable

              Permitted mechanical edits:
              - ...

              Prohibited edits:
              - weaken assertions
              - skip or remove required cases
              - change expected behavior to match implementation
              - replace a real required boundary with a fake
              - ...

              Required authority for material revision:
              - ...

              Revision stop condition:
              - ...

              Accepted baseline record:
              - NOT ESTABLISHED — executing session records the accepted commit / hashes, exact command, environment, result, and evidence identity after accepted initial proof and before production implementation
              - NOT APPLICABLE — only when every relevant PF-* proof has preimplementation applicability NOT_APPLICABLE
      validations:
          required: true

    - type: textarea
      id: security-data-reliability
      attributes:
          label: Security, data, transaction, and reliability boundaries
          description: Address every applicable boundary. Use Not applicable only after confirming the category does not affect this slice.
          placeholder: |
              Principal / actor, action, target, and canonical scope:
              - ...

              Authentication / assurance:
              - ...

              Authorization / object-level boundary:
              - ...

              Tenant / Instance / Workspace isolation:
              - ...

              Validation and untrusted input:
              - ...

              Data classification / sensitive fields / redaction:
              - ...

              Audit, Monitoring, and Notification requirements:
              - ...

              Transaction owner / commit boundary / rollback behavior:
              - ...

              Concurrency / locking:
              - ...

              Retry / timeout / backoff:
              - ...

              Duplicate delivery / idempotency:
              - ...

              After-commit / remote side effects:
              - ...

              Export / retention / erasure / secret implications:
              - ...
      validations:
          required: true

    - type: textarea
      id: ui-authority
      attributes:
          label: UI authority and visual boundaries
          description: For UI work, identify the canonical UI Contract, approved visual authority, implementation owners, required states, accessibility behavior, browser coverage, and manual review. Otherwise state Not applicable.
          placeholder: |
              UI responsibility:
              - ...

              Canonical UI Contract:
              - `...`

              Blade / CSS / JavaScript / test owners:
              - ...

              Approved visual authority:
              - accepted contract / approved implementation / explicit repository-owner direction

              Required states and interactions:
              - ...

              Accessibility requirements:
              - ...

              Browser / viewport / input requirements:
              - ...

              Required manual or specialist review:
              - ...

              Reviewer authority:
              - ...

              Or:
              - Not applicable
      validations:
          required: true

    - type: textarea
      id: final-and-broader-verification
      attributes:
          label: Final targeted proof and broader verification
          description: For proofs with accepted initial execution, require the accepted targeted proof to pass after implementation with protected semantics unchanged and the same command unless a preauthorized nonsemantic path-only update applies. For proofs whose preimplementation stage is NOT_APPLICABLE, declare the required final proof directly. Then list only the broader checks required for this slice.
          placeholder: |
              Final targeted PF-*:
              - ...

              For PF-* with accepted initial execution:
              - Exact final command or procedure: Same as accepted initial proof unless a preauthorized nonsemantic path-only update applies
              - Required protected semantics: unchanged

              For PF-* with preimplementation NOT_APPLICABLE:
              - Exact final command or procedure:
              - Required final proof method / environment:

              Required final result:
              - PASS

              Required final exit code:
              - ...

              Required evidence:
              - ...

              Broader automated checks:
              - command:
                purpose:
                required result:

              PostgreSQL / migration verification:
              - ...
              - Not applicable

              Frontend build:
              - ...
              - Not applicable

              Browser verification:
              - ...
              - Not applicable

              Native-platform / operational verification:
              - ...
              - Not applicable

              Checks intentionally NOT required:
              - ...
      validations:
          required: true

    - type: textarea
      id: documentation-and-review
      attributes:
          label: Documentation synchronization and review authority
          description: Identify durable documentation that must change with implementation and every human or specialist review required before acceptance.
          placeholder: |
              Canonical documentation to update:
              - `docs/...`
              - None

              AGENTS.md / skill updates:
              - ...
              - None

              Required manual or specialist reviews:
              - Review:
                Reviewer authority:
                Surface / environment:
                Procedure:
                Required result:
                May remain when moving to Review: Yes / No

              Repository-owner acceptance required for:
              - ...
      validations:
          required: true

    - type: dropdown
      id: review-types
      attributes:
          label: Required review types
          description: Select every review category required before the issue can be accepted as Done.
          options:
              - General code review
              - Architecture review
              - Database review
              - Security review
              - Privacy or data-governance review
              - UI and accessibility review
              - Operational or deployment review
              - Repository-owner acceptance
          multiple: true
      validations:
          required: true

    - type: textarea
      id: blockers-stop-and-closure
      attributes:
          label: Blockers, stop conditions, integration, and closure authority
          description: Define conditions that require execution to stop rather than infer or remediate, plus the authority required for staging, integration, acceptance, and closure.
          placeholder: |
              Current blockers:
              - #...
              - None

              Open decisions:
              - ...
              - None

              Stop before the first production write when:
              - required or due conditional initial proof cannot execute
              - executed initial result does not match the predeclared result
              - a CONDITIONAL proof is still unresolved when its preimplementation stage becomes due
              - ownership or canonical behavior is unresolved
              - ...

              Stop during implementation when:
              - a mandatory proof returns FAIL
              - scope would expand beyond allowed paths
              - protected evidence would require material revision
              - ...

              Predeclared bounded recoveries:
              - Trigger:
                Exact allowed recovery:
                Maximum attempts:
                Success check:
              - None

              Staging / commit authority:
              - ...

              Integration / merge authority:
              - ...

              Issue acceptance / closure authority:
              - ...

              Cleanup authority:
              - ...
      validations:
          required: true

    - type: checkboxes
      id: readiness-acknowledgement
      attributes:
          label: Readiness acknowledgement
          description: These acknowledgements do not themselves move the issue to Ready. They confirm the issue contains the information required for a readiness decision.
          options:
              - label: I reviewed the current canonical repository sources and did not use remembered or superseded guidance as authority.
                required: true
              - label: Every acceptance criterion has a stable **AC-*** identifier and is mapped to at least one declared **PF-*** proof.
                required: true
              - label: Every **PF-*** proof declares preimplementation applicability. Every REQUIRED or due CONDITIONAL initial proof defines its expected result, environment, command or procedure, and baseline plan, and every criterion has a required final proof.
                required: true
              - label: Expected protected tests, fixtures, Contracts, review procedures, or other baseline evidence are identified before execution, including permitted edits and revision authority; the executing session must record the accepted baseline identity after accepted initial proof when applicable.
                required: true
              - label: Allowed and forbidden repository scope, non-goals, compatibility requirements, and stop conditions are explicit.
                required: true
              - label: I used **Not applicable** or **NOT_APPLICABLE** only after confirming the category or preimplementation stage does not affect this slice, and I did not use it to omit required final proof.
                required: true
              - label: I understand that issue creation is not implementation authorization; Project **Ready** requires the repository's Definition of Ready and a complete executable verification contract, while required initial proof and accepted baseline may be established by the authorized executing session before the first production write.
                required: true
              - label: This issue must not be delegated while Codex or a developer would need to invent architecture, schema, permissions, security policy, transaction behavior, verification semantics, or visual design.
                required: true
