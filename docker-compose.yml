services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - composer-vendor:/var/www/html/vendor
    ports:
      - "${APP_PORT:-8000}:8000"
    networks:
      default:
        aliases:
          - laravel.test
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/up >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    command: sh -lc "composer install && php artisan serve --host=0.0.0.0 --port=8000"

  node:
    image: node:22-alpine
    profiles:
      - docker-vite
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node-modules:/var/www/html/node_modules
    ports:
      - "${VITE_PORT:-5173}:5173"
    environment:
      VITE_DEV_SERVER_URL: "${VITE_DEV_SERVER_URL:-http://localhost:5173}"
      VITE_USE_POLLING: "${VITE_USE_POLLING:-true}"
      VITE_POLLING_INTERVAL: "${VITE_POLLING_INTERVAL:-1000}"
    command: sh -lc "npm install && (npm run dev -- --host 0.0.0.0 --port 5173 & vite_pid=$$!; sleep 3; printf '%s' \"$$VITE_DEV_SERVER_URL\" > public/hot; wait $$vite_pid)"

  playwright:
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    profiles:
      - browser-tests
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - playwright-node-modules:/var/www/html/node_modules
    environment:
      PLAYWRIGHT_BASE_URL: "${PLAYWRIGHT_BASE_URL:-http://laravel.test:8000}"
    depends_on:
      app:
        condition: service_healthy
      queue:
        condition: service_healthy
      reverb:
        condition: service_healthy
    ipc: host
    command: tail -f /dev/null

  reverb:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - composer-vendor:/var/www/html/vendor
    ports:
      - "${REVERB_SERVER_PORT:-8080}:8080"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    command: sh -lc "composer install && php artisan reverb:start --host=0.0.0.0 --port=8080"

  queue:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - composer-vendor:/var/www/html/vendor
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      reverb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = php"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    command: sh -lc "composer install && exec php artisan queue:work redis --queue=default --sleep=1 --tries=3 --timeout=90"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-platform_app}
      POSTGRES_USER: ${DB_USERNAME:-platform_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./.docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-create-test-db.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-platform_app} -d ${DB_DATABASE:-platform_app}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${FORWARD_MAILPIT_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"

volumes:
  postgres-data:
  redis-data:
  composer-vendor:
  node-modules:
  playwright-node-modules:
